                lang
                text
              }
              isGranular
              defaultDistanceKms
            }
            locationsHierarchy {
              id
              kind
              label {
                lang
                text
              }
              contextualName {
                lang
                text
              }
              isGranular
              defaultDistanceKms
            }
          }
          relatedSearchesV1 {
            totalJobs
            text
          }
          organisationV1 {
            organisationId
            organisationName
            totalJobs


  jobSearchV7(params: $params) {
      results {
        jobs {
          id
          title
          abstract
          adDisplay
          advertiser {
            id
            name
          }
          organisation {
            id
            name
            companyProfileId
            companyProfileUrl
            companyProfileRelativeUrlToBeUsedWithZone
          }
          categories {
            id
            label(locale: $locale)
          }
          location {
            id
            countryCode
            displayName {
              text
            }
            seoHierarchy {
              contextualName {
                text
              }
            }
          }
          cjs {
            workTypes {
              sourceId
              name(locale: $locale)
            }
            source {
              isAutoIncluded
            }
            salary {
              hideSalary
              minimum
              maximum
              currency
              period
              displayValue
            }
            roleTitles {
              shortId
              isDistinct
            }
            product {
              branding {
                companyLogoURL
              }
              bullets
              adType {
                sourceId
              }
            }
            externalReferences {
              id
              sourceSystem
              type
              metadata {
                name
                assets {
                  profilePhotoUrl
                }
              }
            }
          }
          listedAt {
            dateTimeUtc
            label(
              context: JOB_POSTED
              length: SHORT
              timezone: $timezone
              locale: $locale

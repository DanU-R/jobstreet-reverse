          locationV1 {
            local {
              sequence
              completions {
                id
                label(
                  locale: $locale
                  zone: $zone
                  context: CONTEXTUAL_NAME
                  labelType: SHORT
                )
              }
            }
            international {
              sequence
              completions {
                id
                label(
                  locale: $locale
                  zone: $zone
                  context: CONTEXTUAL_NAME
                  labelType: SHORT
                )
              }
            }
          }
          sabFilterV1 {
            showSABFilter
          }
          canonicalV1 {
            text
            where {
              id
              name
            }
          }
          spellingCorrectionV1 {
            type
            count
            searchToken
            label {
              lang
              defaultText
            }
            intent {
              country
              locale
              text
              where
              whereId
              sort
              distanceKms
              filter {
                advertiserId
                categoryId
                listedAt
                organisationId
                organisationName
                salaryMin
                salaryMax
                tags
                workTypeId
                workArrangementId
              }
            }
          }
        }
      }
      context {
        searchToken
        filterNewSince
        representations {
          uiV1 {
            country
            locale
            text
            where
            whereId
            sort
            distanceKms
            filter {
              advertiserId
              categoryId
              categoryName
              listedAt
              organisationId
              organisationName
              salaryMin
              salaryMax
              tags
              workTypeId
              workArrangementId
            }
          }
        }
      }
      metadata {
        flight
        request {
          correlationId
        }
        sol
      }

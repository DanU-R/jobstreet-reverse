            id
            label {
              lang
              text
            }
          }
          activity {
            visitedApplicationSite {
              count
              mostRecent {
                dateTimeUtc
              }
            }
            applicationEnds {
              count
              mostRecent {
                dateTimeUtc
              }
            }
            applicationStarts {
              count
              mostRecent {
                dateTimeUtc
              }
            }
            impressions {
              count
              mostRecent {
                dateTimeUtc
              }
            }
            jobDetails {
              count
              mostRecent {
                dateTimeUtc
              }
            }
          }
        }
        pagination {
          page
          pageSize
          resultCount
        }
      }
      enrichment {
        facets {
          categoryV1 {
            id
            label {
              lang
              text
            }
            count
          }
          distinctTitleV1 {
            id
            label
            count
          }
        }
        suggestions {
          queryParamLabelsV1 {
            text
            where {
              id
              kind
              label {
                lang
                text
